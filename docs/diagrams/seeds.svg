<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Seeds: the first slot of a class pays one cold import and is snapshotted as a read-only seed after a clean exit; further slots are reflink clones of the seed; when the base branch moves, a recycled slot becomes the next seed and the old one is garbage collected. A clone shares every disk block with its seed until the slot writes it.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="30" font-weight="bold" font-size="14" fill="#111827">Seeds: warm state as a forkable asset (one class: unity 6000.3 · android)</text>

  <!-- row 1 -->
  <rect x="40" y="60" width="220" height="80" rx="5" fill="#ffffff" stroke="#374151"/>
  <g text-anchor="middle" fill="#111827">
    <text x="150" y="85" font-weight="bold">first slot of a class</text>
    <text x="150" y="105">cold start: full import</text>
    <text x="150" y="123">paid once per class</text>
  </g>
  <line x1="260" y1="100" x2="328" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="294" y="90" text-anchor="middle" font-size="11" fill="#111827">clean exit</text>
  <text x="294" y="118" text-anchor="middle" font-size="11" fill="#111827">+ snapshot</text>

  <rect x="330" y="60" width="200" height="80" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#111827">
    <text x="430" y="85" font-weight="bold">seed v1</text>
    <text x="430" y="105">android · main@a1b2</text>
    <text x="430" y="123">read-only</text>
  </g>

  <g stroke="#c2410c" stroke-width="1.5">
    <line x1="530" y1="100" x2="638" y2="60" marker-end="url(#acc)"/>
    <line x1="530" y1="100" x2="638" y2="110" marker-end="url(#acc)"/>
    <line x1="530" y1="100" x2="638" y2="160" marker-end="url(#acc)"/>
  </g>
  <text x="585" y="56" text-anchor="middle" font-weight="bold" fill="#c2410c">reflink clone</text>

  <g fill="#f9fafb" stroke="#374151">
    <rect x="640" y="42" width="200" height="36" rx="4"/>
    <rect x="640" y="92" width="200" height="36" rx="4"/>
    <rect x="640" y="142" width="200" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="740" y="65">slot 1 · agent A's tree</text>
    <text x="740" y="115">slot 2 · agent B's tree</text>
    <text x="740" y="165">slot 3 · idle</text>
  </g>
  <g fill="#374151">
    <text x="880" y="70" font-weight="bold" fill="#111827">slots are disposable</text>
    <text x="880" y="90">a crash costs a reboot from the</text>
    <text x="880" y="108">slot's own Library, not a reimport;</text>
    <text x="880" y="126">a broken slot is thrown away and</text>
    <text x="880" y="144">regrown from the seed</text>
  </g>

  <!-- recycle link -->
  <line x1="740" y1="178" x2="432" y2="288" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="610" y="222" font-size="11" fill="#111827">recycled at a quiet time</text>

  <!-- row 2 -->
  <rect x="40" y="290" width="220" height="80" rx="5" fill="#ffffff" stroke="#374151"/>
  <g text-anchor="middle" fill="#111827">
    <text x="150" y="315" font-weight="bold">base branch moves</text>
    <text x="150" y="335">N commits or M files</text>
    <text x="150" y="353">since the seed</text>
  </g>
  <line x1="260" y1="330" x2="328" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="294" y="320" text-anchor="middle" font-size="11" fill="#111827">triggers</text>

  <rect x="330" y="290" width="200" height="80" rx="5" fill="#ffffff" stroke="#374151"/>
  <g text-anchor="middle" fill="#111827">
    <text x="430" y="315" font-weight="bold">slot 3 refreshed</text>
    <text x="430" y="335">synced to main@c3d4</text>
    <text x="430" y="353">runs green, exits cleanly</text>
  </g>
  <line x1="530" y1="330" x2="638" y2="330" stroke="#c2410c" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="585" y="320" text-anchor="middle" font-size="11" fill="#c2410c">clean exit</text>
  <text x="585" y="348" text-anchor="middle" font-size="11" fill="#c2410c">+ snapshot</text>

  <rect x="640" y="290" width="200" height="80" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#111827">
    <text x="740" y="315" font-weight="bold">seed v2</text>
    <text x="740" y="335">android · main@c3d4</text>
    <text x="740" y="353">new slots grow from here</text>
  </g>
  <line x1="840" y1="330" x2="898" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="869" y="320" text-anchor="middle" font-size="11" fill="#111827">retires v1</text>

  <rect x="900" y="290" width="260" height="80" rx="5" fill="#ffffff" stroke="#374151" stroke-dasharray="5 4"/>
  <g text-anchor="middle" fill="#111827">
    <text x="1030" y="315" font-weight="bold">seed v1 gc'd</text>
    <text x="1030" y="335">once no live slot</text>
    <text x="1030" y="353">was grown from it</text>
  </g>

  <!-- CoW panel -->
  <rect x="40" y="410" width="1120" height="190" rx="8" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="435" font-weight="bold" font-size="14" fill="#111827">What a clone costs on disk (copy-on-write)</text>
  <text x="60" y="476" fill="#111827">seed v1 Library</text>
  <text x="60" y="566" fill="#111827">slot 1 Library</text>

  <g stroke="#9ca3af">
    <line x1="215" y1="487" x2="215" y2="545"/><line x1="253" y1="487" x2="253" y2="545"/>
    <line x1="291" y1="487" x2="291" y2="545"/><line x1="367" y1="487" x2="367" y2="545"/>
    <line x1="405" y1="487" x2="405" y2="545"/><line x1="443" y1="487" x2="443" y2="545"/>
    <line x1="481" y1="487" x2="481" y2="545"/><line x1="557" y1="487" x2="557" y2="545"/>
    <line x1="595" y1="487" x2="595" y2="545"/><line x1="633" y1="487" x2="633" y2="545"/>
  </g>
  <g fill="#fff7ed" stroke="#c2410c">
    <rect x="200" y="457" width="30" height="30"/><rect x="238" y="457" width="30" height="30"/>
    <rect x="276" y="457" width="30" height="30"/><rect x="314" y="457" width="30" height="30"/>
    <rect x="352" y="457" width="30" height="30"/><rect x="390" y="457" width="30" height="30"/>
    <rect x="428" y="457" width="30" height="30"/><rect x="466" y="457" width="30" height="30"/>
    <rect x="504" y="457" width="30" height="30"/><rect x="542" y="457" width="30" height="30"/>
    <rect x="580" y="457" width="30" height="30"/><rect x="618" y="457" width="30" height="30"/>
  </g>
  <g fill="#ffffff" stroke="#6b7280" stroke-dasharray="3 3">
    <rect x="200" y="545" width="30" height="30"/><rect x="238" y="545" width="30" height="30"/>
    <rect x="276" y="545" width="30" height="30"/>
    <rect x="352" y="545" width="30" height="30"/><rect x="390" y="545" width="30" height="30"/>
    <rect x="428" y="545" width="30" height="30"/><rect x="466" y="545" width="30" height="30"/>
    <rect x="542" y="545" width="30" height="30"/><rect x="580" y="545" width="30" height="30"/>
    <rect x="618" y="545" width="30" height="30"/>
  </g>
  <g fill="#fdba74" stroke="#c2410c">
    <rect x="314" y="545" width="30" height="30"/>
    <rect x="504" y="545" width="30" height="30"/>
  </g>

  <text x="700" y="470" font-weight="bold" fill="#111827">reflink (btrfs, XFS) or APFS clone</text>
  <text x="700" y="490" fill="#374151">shares every block with the seed until the slot writes it;</text>
  <text x="700" y="508" fill="#374151">the slot owns only the blocks it changed (orange)</text>
  <text x="700" y="545" font-weight="bold" fill="#111827">full copy (fallback, e.g. ext4)</text>
  <text x="700" y="565" fill="#374151">duplicates every block: several GB per slot</text>
  <text x="700" y="583" fill="#374151">clone and first-boot times: to measure in the spike</text>
</svg>
