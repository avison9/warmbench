<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Slot lifecycle: a slot grown from a seed boots, idles, and on each lease moves through syncing, refreshing, running and reporting back to ready; crashes and hangs lead to dead and recycling, which reboots from the slot's own Library; every lease increments an epoch so a late message from a hung editor is dropped.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
  <text x="40" y="30" font-weight="bold" font-size="14" fill="#111827">Slot lifecycle and lease epochs</text>

  <!-- states -->
  <g fill="#ffffff" stroke="#374151">
    <rect x="40" y="60" width="170" height="54" rx="27"/>
    <rect x="270" y="60" width="170" height="54" rx="27"/>
    <rect x="760" y="60" width="170" height="54" rx="27"/>
    <rect x="990" y="60" width="170" height="54" rx="27"/>
    <rect x="500" y="200" width="170" height="54" rx="27"/>
    <rect x="760" y="200" width="170" height="54" rx="27"/>
    <rect x="990" y="200" width="170" height="54" rx="27"/>
    <rect x="500" y="340" width="170" height="54" rx="27"/>
  </g>
  <rect x="500" y="60" width="170" height="54" rx="27" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <rect x="760" y="340" width="170" height="54" rx="27" fill="#ffffff" stroke="#374151" stroke-dasharray="5 4"/>
  <rect x="40" y="200" width="170" height="54" rx="27" fill="#ffffff" stroke="#374151" stroke-dasharray="5 4"/>

  <g text-anchor="middle" fill="#111827">
    <text x="125" y="82" font-weight="bold">PROVISIONED</text><text x="125" y="100" font-size="11">cloned from seed</text>
    <text x="355" y="82" font-weight="bold">BOOTING</text><text x="355" y="100" font-size="11">editor starts, handshake</text>
    <text x="585" y="82" font-weight="bold">READY</text><text x="585" y="100" font-size="11">idle, manifest known</text>
    <text x="845" y="82" font-weight="bold">SYNCING</text><text x="845" y="100" font-size="11">copy diff, delete removed</text>
    <text x="1075" y="82" font-weight="bold">REFRESHING</text><text x="1075" y="100" font-size="11">import, compile, reload</text>
    <text x="125" y="222" font-weight="bold">QUARANTINED</text><text x="125" y="240" font-size="11">needs a human</text>
    <text x="585" y="222" font-weight="bold">DRAINING</text><text x="585" y="240" font-size="11">no new lease</text>
    <text x="845" y="222" font-weight="bold">REPORTING</text><text x="845" y="240" font-size="11">store result, rehash</text>
    <text x="1075" y="222" font-weight="bold">RUNNING</text><text x="1075" y="240" font-size="11">TestRunnerApi, progress</text>
    <text x="585" y="362" font-weight="bold">RECYCLING</text><text x="585" y="380" font-size="11">clean exit, maybe snapshot</text>
    <text x="845" y="362" font-weight="bold">DEAD</text><text x="845" y="380" font-size="11">process group killed</text>
  </g>

  <!-- happy path -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="210" y1="87" x2="268" y2="87" marker-end="url(#a)"/>
    <line x1="440" y1="87" x2="498" y2="87" marker-end="url(#a)"/>
    <line x1="930" y1="87" x2="988" y2="87" marker-end="url(#a)"/>
    <line x1="1075" y1="114" x2="1075" y2="198" marker-end="url(#a)"/>
    <line x1="990" y1="227" x2="932" y2="227" marker-end="url(#a)"/>
    <line x1="990" y1="112" x2="930" y2="198" marker-end="url(#a)"/>
    <line x1="790" y1="200" x2="672" y2="112" marker-end="url(#a)"/>
  </g>
  <line x1="670" y1="87" x2="758" y2="87" stroke="#c2410c" stroke-width="2" marker-end="url(#acc)"/>
  <text x="470" y="78" text-anchor="middle" font-size="11" fill="#111827">ok</text>
  <text x="714" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">lease, epoch+1</text>
  <text x="1083" y="160" font-size="11" fill="#111827">compiled</text>
  <text x="961" y="219" text-anchor="middle" font-size="11" fill="#111827">done</text>
  <text x="955" y="150" text-anchor="end" font-size="11" fill="#111827">compile error</text>
  <text x="740" y="170" font-size="11" fill="#111827">result, dirty files rehashed</text>

  <!-- recycle / failure paths -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="585" y1="114" x2="585" y2="198" marker-end="url(#a)"/>
    <line x1="585" y1="254" x2="585" y2="338" marker-end="url(#a)"/>
    <polyline points="1075,254 1075,367 932,367" marker-end="url(#a)"/>
    <line x1="760" y1="367" x2="672" y2="367" marker-end="url(#a)"/>
    <polyline points="500,367 355,367 355,116" marker-end="url(#a)"/>
    <line x1="285" y1="114" x2="140" y2="198" marker-end="url(#a)"/>
  </g>
  <text x="577" y="150" text-anchor="end" font-size="11" fill="#111827">recycle due</text>
  <text x="577" y="164" text-anchor="end" font-size="11" fill="#111827">(jobs, RSS, reloads)</text>
  <text x="593" y="300" font-size="11" fill="#111827">idle: clean exit</text>
  <text x="1067" y="300" text-anchor="end" font-size="11" fill="#111827">crash · hang · progress stall</text>
  <text x="1067" y="314" text-anchor="end" font-size="11" fill="#111827">(watchdog, any busy state)</text>
  <text x="716" y="359" text-anchor="middle" font-size="11" fill="#111827">kill</text>
  <text x="363" y="250" font-size="11" fill="#111827">reboot from the</text>
  <text x="363" y="264" font-size="11" fill="#111827">slot's own Library</text>
  <text x="208" y="150" text-anchor="end" font-size="11" fill="#111827">boot fails k times</text>
  <text x="845" y="418" text-anchor="middle" font-size="11" fill="#374151">job requeued once on another slot;</text>
  <text x="845" y="432" text-anchor="middle" font-size="11" fill="#374151">a second crash ends it as CRASHED</text>

  <!-- fencing panel -->
  <rect x="40" y="460" width="1120" height="170" rx="8" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="485" font-weight="bold" font-size="14" fill="#111827">Epoch fencing: a stale editor cannot deliver a result</text>
  <line x1="80" y1="590" x2="1118" y2="590" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1120" y="612" text-anchor="end" font-size="11" fill="#374151">time</text>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="150" y1="580" x2="150" y2="600"/><line x1="350" y1="580" x2="350" y2="600"/>
    <line x1="550" y1="580" x2="550" y2="600"/><line x1="750" y1="580" x2="750" y2="600"/>
  </g>
  <line x1="950" y1="576" x2="950" y2="604" stroke="#c2410c" stroke-width="2"/>
  <g text-anchor="middle" fill="#111827">
    <text x="150" y="535">lease job A</text><text x="150" y="551">epoch 41</text>
    <text x="350" y="535">editor main thread</text><text x="350" y="551">silent &gt; K s</text>
    <text x="550" y="535">watchdog: DEAD</text><text x="550" y="551">job A requeued</text>
    <text x="750" y="535">reboot, lease job B</text><text x="750" y="551">epoch 42</text>
  </g>
  <g text-anchor="middle" fill="#c2410c">
    <text x="950" y="535">late message from old editor:</text><text x="950" y="551">result(job A, epoch 41)</text>
    <text x="950" y="620" font-weight="bold">dropped: 41 is older than 42</text>
  </g>
</svg>
