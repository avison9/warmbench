<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Verification ladder: a job climbs from R0 compile through affected EditMode, affected PlayMode and full suites to an optional device rung, only as far as the agent's goal, and stops at the first failure, which is returned to the agent with labelled failures.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="30" font-weight="bold" font-size="14" fill="#111827">Verification ladder: cheapest sufficient answer first</text>

  <!-- rules -->
  <rect x="60" y="60" width="380" height="130" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <g fill="#111827">
    <text x="76" y="84">The agent asks for a goal: compile, editmode,</text>
    <text x="76" y="102">playmode, full or device.</text>
    <text x="76" y="124">The planner runs rungs up to the goal and</text>
    <text x="76" y="142">stops at the first failure.</text>
    <text x="76" y="164">A rung already cached for this key is skipped.</text>
    <text x="76" y="182">final priority: R3 is always the full suite.</text>
  </g>

  <!-- rungs -->
  <g fill="#ffffff" stroke="#374151">
    <rect x="60" y="440" width="300" height="62" rx="5"/>
    <rect x="260" y="350" width="300" height="62" rx="5"/>
    <rect x="460" y="260" width="300" height="62" rx="5"/>
    <rect x="660" y="170" width="300" height="62" rx="5"/>
  </g>
  <rect x="860" y="80" width="300" height="62" rx="5" fill="#ffffff" stroke="#374151" stroke-dasharray="5 4"/>
  <g fill="#111827">
    <text x="76" y="460" font-weight="bold">R0 compile</text>
    <text x="76" y="478" font-size="11">compile lane · no editor slot held</text>
    <text x="76" y="494" font-size="11">fail fast only: green is not final</text>

    <text x="276" y="370" font-weight="bold">R1 EditMode, affected</text>
    <text x="276" y="388" font-size="11">editor lane · headless slot</text>
    <text x="276" y="404" font-size="11">asmdef graph picks the tests</text>

    <text x="476" y="280" font-weight="bold">R2 PlayMode, affected</text>
    <text x="476" y="298" font-size="11">editor lane · graphics slot if needed</text>
    <text x="476" y="314" font-size="11">quiet token for timing tests</text>

    <text x="676" y="190" font-weight="bold">R3 full suites</text>
    <text x="676" y="208" font-size="11">editor lane · EditMode + PlayMode</text>
    <text x="676" y="224" font-size="11">always for final priority</text>

    <text x="876" y="100" font-weight="bold">R4 device smoke (opt-in)</text>
    <text x="876" y="118" font-size="11">build lane + device lane</text>
    <text x="876" y="134" font-size="11">emulator · simulator · USB phone</text>
  </g>

  <!-- pass arrows -->
  <g stroke="#c2410c" stroke-width="2">
    <line x1="310" y1="440" x2="310" y2="414" marker-end="url(#acc)"/>
    <line x1="510" y1="350" x2="510" y2="324" marker-end="url(#acc)"/>
    <line x1="710" y1="260" x2="710" y2="234" marker-end="url(#acc)"/>
    <line x1="910" y1="170" x2="910" y2="144" marker-end="url(#acc)"/>
  </g>
  <g fill="#c2410c" font-size="11" font-weight="bold" text-anchor="end">
    <text x="302" y="431">pass</text>
    <text x="502" y="341">pass</text>
    <text x="702" y="251">pass</text>
    <text x="902" y="161">pass</text>
  </g>

  <!-- fail arrows -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="200" y1="502" x2="200" y2="528" marker-end="url(#a)"/>
    <line x1="500" y1="412" x2="500" y2="528" marker-end="url(#a)"/>
    <line x1="700" y1="322" x2="700" y2="528" marker-end="url(#a)"/>
    <line x1="900" y1="232" x2="900" y2="528" marker-end="url(#a)"/>
    <line x1="1100" y1="142" x2="1100" y2="528" marker-end="url(#a)"/>
  </g>
  <g fill="#111827" font-size="11">
    <text x="208" y="520">fail</text>
    <text x="508" y="470">fail</text>
    <text x="708" y="430">fail</text>
    <text x="908" y="390">fail</text>
    <text x="1108" y="340">fail</text>
  </g>

  <!-- result bar -->
  <rect x="60" y="530" width="1100" height="50" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="610" y="551" text-anchor="middle" font-weight="bold" fill="#111827">result to the agent</text>
  <text x="610" y="569" text-anchor="middle" fill="#111827">PASS at the goal rung, or the first failure: compile errors with file and line, or failing tests labelled new · pre-existing · flaky</text>
</svg>
