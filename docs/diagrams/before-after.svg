<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Before: four agents serialise on one lock and the last waits about an hour, with most of each run spent on cold start. After: two warm slots run in parallel, a compile error returns from the compile lane without holding an editor, and an identical tree attaches to a running job instead of running again.">
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>

  <!-- BEFORE -->
  <text x="40" y="36" font-weight="bold" font-size="14" fill="#111827">Before: four agents behind one flock lock (observed on bleed, 2026-11-02)</text>
  <g fill="#111827">
    <text x="40" y="80">agent A</text>
    <text x="40" y="125">agent B</text>
    <text x="40" y="170">agent C</text>
    <text x="40" y="215">agent D</text>
  </g>
  <!-- waits -->
  <g fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 4">
    <rect x="160" y="105" width="220.5" height="30"/>
    <rect x="160" y="150" width="441" height="30"/>
    <rect x="160" y="195" width="661.5" height="30"/>
  </g>
  <g fill="#4b5563" text-anchor="middle" font-size="11">
    <text x="270" y="124">waiting on lock</text>
    <text x="380" y="169">waiting on lock</text>
    <text x="490" y="214">waiting on lock (up to an hour)</text>
  </g>
  <!-- cold overhead -->
  <g fill="#d1d5db" stroke="#374151">
    <rect x="160" y="60" width="171.5" height="30"/>
    <rect x="380.5" y="105" width="171.5" height="30"/>
    <rect x="601" y="150" width="171.5" height="30"/>
    <rect x="821.5" y="195" width="171.5" height="30"/>
  </g>
  <g fill="#111827" text-anchor="middle" font-size="11">
    <text x="245.75" y="79">cold start · import · compile</text>
    <text x="466.25" y="124">cold start · import · compile</text>
    <text x="686.75" y="169">cold start · import · compile</text>
    <text x="907.25" y="214">cold start · import · compile</text>
  </g>
  <!-- tests -->
  <g fill="#374151">
    <rect x="331.5" y="60" width="49" height="30"/>
    <rect x="552" y="105" width="49" height="30"/>
    <rect x="772.5" y="150" width="49" height="30"/>
    <rect x="993" y="195" width="49" height="30"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-size="11">
    <text x="356" y="79">tests</text>
    <text x="576.5" y="124">tests</text>
    <text x="797" y="169">tests</text>
    <text x="1017.5" y="214">tests</text>
  </g>
  <!-- axis -->
  <line x1="160" y1="240" x2="1140" y2="240" stroke="#374151"/>
  <g stroke="#374151">
    <line x1="160" y1="240" x2="160" y2="246"/><line x1="282.5" y1="240" x2="282.5" y2="246"/>
    <line x1="405" y1="240" x2="405" y2="246"/><line x1="527.5" y1="240" x2="527.5" y2="246"/>
    <line x1="650" y1="240" x2="650" y2="246"/><line x1="772.5" y1="240" x2="772.5" y2="246"/>
    <line x1="895" y1="240" x2="895" y2="246"/><line x1="1017.5" y1="240" x2="1017.5" y2="246"/>
    <line x1="1140" y1="240" x2="1140" y2="246"/>
  </g>
  <g fill="#374151" text-anchor="middle" font-size="11">
    <text x="160" y="259">0</text><text x="282.5" y="259">10</text><text x="405" y="259">20</text>
    <text x="527.5" y="259">30</text><text x="650" y="259">40</text><text x="772.5" y="259">50</text>
    <text x="895" y="259">60</text><text x="1017.5" y="259">70</text><text x="1140" y="259">80 min</text>
  </g>
  <text x="160" y="282" font-size="11" fill="#4b5563">Run length observed: 15 to 20 minutes per full play-mode run. The split between overhead and test time is illustrative.</text>

  <line x1="40" y1="305" x2="1160" y2="305" stroke="#d1d5db"/>

  <!-- AFTER -->
  <text x="40" y="336" font-weight="bold" font-size="14" fill="#111827">After: warmbench (shape only; warm overhead is a hypothesis until the spike)</text>
  <g fill="#111827">
    <text x="40" y="380">agent A</text>
    <text x="40" y="425">agent B</text>
    <text x="40" y="470">agent C</text>
    <text x="40" y="515">agent D</text>
  </g>
  <g fill="#fdba74" stroke="#c2410c">
    <rect x="160" y="360" width="40" height="30"/>
    <rect x="160" y="405" width="40" height="30"/>
    <rect x="160" y="450" width="20" height="30"/>
  </g>
  <g fill="#7c2d12" text-anchor="middle" font-size="11" font-weight="bold">
    <text x="180" y="379">?</text>
    <text x="180" y="424">?</text>
    <text x="170" y="469">R0</text>
  </g>
  <g fill="#374151">
    <rect x="200" y="360" width="49" height="30"/>
    <rect x="200" y="405" width="49" height="30"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-size="11">
    <text x="224.5" y="379">tests</text>
    <text x="224.5" y="424">tests</text>
  </g>
  <line x1="160" y1="510" x2="246" y2="510" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="249" cy="510" r="4" fill="#374151"/>
  <g fill="#111827">
    <text x="262" y="380">slot 1 (android, headless): warm sync + incremental compile, then the same tests</text>
    <text x="262" y="425">slot 2 (android, graphics): runs in parallel when the resource governor admits it</text>
    <text x="192" y="470">compile lane: compile error returned in the R0 rung, no editor slot held</text>
    <text x="262" y="515">same tree as agent B: attaches to B's running job (dedupe), result arrives with B's</text>
  </g>
  <line x1="160" y1="540" x2="1140" y2="540" stroke="#374151"/>
  <text x="1140" y="558" text-anchor="end" font-size="11" fill="#374151">time: test bars use the same scale as above; warm overhead (?) is to be measured</text>

  <!-- legend -->
  <rect x="160" y="590" width="22" height="14" fill="#d1d5db" stroke="#374151"/>
  <text x="190" y="602" fill="#111827">cold overhead</text>
  <rect x="320" y="590" width="22" height="14" fill="#374151"/>
  <text x="350" y="602" fill="#111827">tests</text>
  <rect x="430" y="590" width="22" height="14" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="460" y="602" fill="#111827">waiting</text>
  <rect x="550" y="590" width="22" height="14" fill="#fdba74" stroke="#c2410c"/>
  <text x="580" y="602" fill="#111827">warm overhead or compile rung (to measure)</text>
</svg>
